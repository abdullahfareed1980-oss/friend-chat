name: friend_chat
description: "Friend Chat - a private, end-to-end encrypted messenger for exactly two people."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2

  # realtime + http
  socket_io_client: ^3.0.2
  http: ^1.2.2

  # offline cache (encrypted Hive boxes)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4

  # end-to-end encryption primitives (X25519 + AES-256-GCM)
  cryptography: ^2.7.0
  crypto: ^3.0.5

  # device niceties
  connectivity_plus: ^6.0.5
  device_info_plus: ^11.0.1
  uuid: ^4.5.0
  intl: ^0.19.0

  # background execution + local notifications (no FCM / APNs anywhere)
  flutter_foreground_task: ^8.14.0
  flutter_local_notifications: ^17.2.4

  # onboarding + media
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
